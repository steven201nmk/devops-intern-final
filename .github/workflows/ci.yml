name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least privilege: every job can only read the repository.
# The publish job alone is granted packages: write below.
permissions:
  contents: read

env:
  IMAGE_LOCAL: nginx-app:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck scripts/
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

      - name: Hadolint app/Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < app/Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build image with the commit SHA baked in
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --tag "$IMAGE_LOCAL" \
            ./app
          docker image ls nginx-app

      - name: Save image for the test and publish jobs
        run: docker save "$IMAGE_LOCAL" --output nginx-app.tar

      - uses: actions/upload-artifact@v7
        with:
          name: nginx-app-image
          path: nginx-app.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: nginx-app-image

      - name: Load the built image
        run: docker load --input nginx-app.tar

      - name: Start the container
        run: docker run --detach --name nginx-app --publish 8080:8080 "$IMAGE_LOCAL"

      - name: Wait for readiness (Docker HEALTHCHECK = healthy)
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' nginx-app)"
            echo "attempt ${attempt}: ${status}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy"
          exit 1

      - name: Run scripts/healthcheck.sh (fails the job on any non-200)
        run: |
          ./scripts/healthcheck.sh http://localhost:8080/
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Check the page shows this commit's SHA
        run: curl -fsS http://localhost:8080/ | grep "${{ github.sha }}"

      - name: Container logs
        if: always()
        run: docker logs nginx-app || true

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # Publish the exact image that passed the test job instead of rebuilding it.
      - uses: actions/download-artifact@v8
        with:
          name: nginx-app-image

      - name: Load the tested image
        run: docker load --input nginx-app.tar

      - name: Log in to GHCR with the workflow's short-lived GITHUB_TOKEN
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag and push (commit SHA + latest)
        run: |
          # GHCR image names must be lowercase
          image="$(echo "ghcr.io/${GITHUB_REPOSITORY}/nginx-app" | tr '[:upper:]' '[:lower:]')"
          docker tag "$IMAGE_LOCAL" "${image}:${GITHUB_SHA}"
          docker tag "$IMAGE_LOCAL" "${image}:latest"
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          echo "Published ${image}:${GITHUB_SHA} and ${image}:latest" >> "$GITHUB_STEP_SUMMARY"
