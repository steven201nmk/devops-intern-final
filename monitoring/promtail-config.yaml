server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Discover every container on the local Docker engine (Nomad allocations
  # and plain `docker run` containers) and read its stdout/stderr through
  # the Docker API.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # container: Docker container name without the leading "/"
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # stream: stdout (NGINX access log) or stderr (NGINX error log)
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      # job: default "docker"; replaced below when the container has a "job" label
      - target_label: job
        replacement: docker
      - source_labels: ['__meta_docker_container_label_job']
        regex: '(.+)'
        target_label: job

      # service: from the Nomad job's "service" label, or the compose service name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '(.+)'
        target_label: service
      - source_labels: ['__meta_docker_container_label_service']
        regex: '(.+)'
        target_label: service

      # nomad_alloc_id: added automatically by Nomad's docker driver
      - source_labels: ['__meta_docker_container_label_com_hashicorp_nomad_alloc_id']
        regex: '(.+)'
        target_label: nomad_alloc_id
